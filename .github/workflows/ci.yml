name: CI

# Task 58, Phase 7: runs on every push/PR against main. Uses a real
# Postgres service container so `prisma migrate deploy` is exercised for
# real — this is the one thing this project's own dev sandbox couldn't
# verify throughout its build (no outbound network access to Prisma's
# engine-binary CDN), so it's the most valuable thing this pipeline adds
# beyond what could already be checked locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playsphere
          POSTGRES_PASSWORD: playsphere
          POSTGRES_DB: playsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playsphere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://playsphere:playsphere@localhost:5432/playsphere_ci
      JWT_SECRET: ci-only-secret-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
